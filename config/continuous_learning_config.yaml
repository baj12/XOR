# Continuous Learning Configuration
# For autonomous 24/7 audio classification from stereo WAV streams

# Experiment metadata
experiment:
  id: "continuous_001"
  description: "Continuous learning from stereo audio streams"
  noise_dimensions: 0
  class_separation: 1.0
  use_gpu: true
  generate_advanced_viz: false  # Disable GA visualizations for continuous mode
  viz_include_pca: false
  viz_include_tsne: false
  viz_layer_progression: false
  viz_roc_curves: false
  viz_statistical_analysis: false
  viz_hyperparameter_impact: false

# Data configuration
data:
  input_dim: 680  # Will be set automatically from audio features
  class_distribution: 0.5
  dataset_size: 10000  # Initial dataset size
  use_gpu: true
  samples_per_file: 60  # 60 segments from 1-minute files (1 sample/sec)

# Audio processing
audio:
  sample_rate: 22050
  segment_duration: 1.0
  hop_length: 512
  n_fft: 2048
  n_mels: 128
  n_mfcc: 13
  feature_types:
    - mfcc
    - spectral
  # Audio files can be specified here or via --audio-files flag
  # audio_files:
  #   class_0:
  #     paths:
  #       - ~/data/rubix44/exp5.empty.noise.wav
  #   class_1:
  #     paths:
  #       - ~/data/rubix44/lavendar.1.noise.2hrs.wav

# Genetic algorithm (used only for monthly full retraining)
ga:
  population_size: 20
  cxpb: 0.7
  mutpb: 0.2
  ngen: 20
  n_processes: 1
  max_time_per_ind: 3600
  epochs: 20

# Model architecture
model:
  hidden_layers: [128, 64, 32]
  neurons_per_layer: 64  # Not used when hidden_layers is specified
  skip_connections: null
  activation: relu
  optimizer: adam
  lr: 0.001
  batch_size: 32
  input_dim: 680

# Metrics tracking
metrics:
  tracking:
    model:
      track_parameters: true
      track_capacity_utilization: false
    training:
      track_time: true
      track_memory: true
      track_convergence: true
    evaluation:
      track_accuracy: true
      track_loss: true
      track_success_probability: true

# Orchestration configuration (for continuous learning)
orchestration:
  # Data ingestion
  data_check_interval_minutes: 60  # Check for new data every hour
  audio_source_dir: null  # Set to path where new WAV files arrive, or use --data-dir
  min_duration_sec: 60.0  # Minimum 1 minute of audio required
  max_files_per_day: 100  # Safety limit

  # Training schedule
  training_day_of_week: 0  # 0=Monday, 1=Tuesday, ..., 6=Sunday
  training_hour: 2  # 2 AM (avoid peak hours)
  min_samples_for_training: 1000  # Wait until at least 1000 samples
  training_window_weeks: 4  # Use last 4 weeks of data

  # Update strategy
  update_mode: hybrid  # Options: 'incremental', 'full_retrain', 'hybrid'
  incremental_epochs: 5  # Epochs for weekly incremental updates
  incremental_lr: 0.0001  # Lower learning rate for fine-tuning
  full_retrain_frequency_weeks: 4  # Full retrain every 4 weeks (monthly)

  # Monitoring and alerts
  alert_on_drift: true
  alert_on_performance_drop: true
  performance_drop_threshold: 0.05  # Alert if accuracy drops >5%
  drift_score_threshold: 0.5  # Alert if KL divergence > 0.5

  # Email settings
  # IMPORTANT: Set EMAIL_PASSWORD environment variable before running!
  # Example: export EMAIL_PASSWORD="your-app-password"
  email_recipients:
    - user@example.com  # Replace with actual email
  email_smtp_server: smtp.gmail.com
  email_smtp_port: 587
  email_sender: noreply@example.com  # Replace with actual sender
  email_password: null  # Will be read from EMAIL_PASSWORD env var

  # Reporting
  weekly_report_day: Monday
  weekly_report_time: "09:00"

  # Storage management
  raw_retention_days: 90  # Keep raw WAV files for 3 months
  archive_location: null  # Set to path for cold storage archival
  disk_warning_threshold: 0.9  # Warn when disk >90% full

  # Visualization
  create_visualizations: true
  visualizations_dir: visualizations/continuous

# Usage Examples:
#
# 1. Test mode (run for 24 hours):
#    python -m src.continuous.orchestrator \
#        --config config/continuous_learning_config.yaml \
#        --db data/continuous/features.db \
#        --model-dir models/continuous \
#        --report-dir reports/continuous \
#        --test-hours 24
#
# 2. Production mode (runs forever):
#    export EMAIL_PASSWORD="your-app-password"
#    python -m src.continuous.orchestrator \
#        --config config/continuous_learning_config.yaml \
#        --db data/continuous/features.db \
#        --model-dir models/continuous \
#        --report-dir reports/continuous \
#        --data-dir /path/to/incoming/wav/files
#
# 3. Dry run (no training/emails):
#    python -m src.continuous.orchestrator \
#        --config config/continuous_learning_config.yaml \
#        --db test.db \
#        --model-dir test_models \
#        --report-dir test_reports \
#        --dry-run
